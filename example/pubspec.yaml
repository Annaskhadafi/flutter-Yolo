name: roadchitra_example
description: "Demonstrates how to use the ultralytics_yolo plugin."
publish_to: "none"
version: 0.8.0+28

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_links: ^7.0.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  material_ui: ^1.11.1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  # Pinned to ^12.x: share_plus 13.x ships a Swift Package umbrella that fails framework module verification under
  # Xcode 26.5 ("'Flutter/Flutter.h' file not found", "double-quoted include in framework header"). Revisit once the
  # upstream package re-publishes with a compatible module map.
  share_plus: ^12.0.0
  ultralytics_yolo:
    path: ../
  pdf: ^3.12.0
  excel: ^4.0.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/
